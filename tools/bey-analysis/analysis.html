<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ベイX 対戦分析</title>
<style>
:root{--bg:#04071a;--panel:#0a1030;--panel2:#121a42;--line:#2a3566;--text:#e8edff;--sub:#93a0d0;--blue:#5aabff;--gold:#ffd740;--red:#ef4444;--green:#4ade80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans JP",system-ui,sans-serif;font-size:14px}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:18px;margin:0 12px 0 0;color:var(--gold)}
main{padding:12px 16px 40px;max-width:1200px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.bar label{color:var(--sub);font-size:12px}
input,select,button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer;font-weight:700}
button.on{border-color:var(--gold);background:#1a2660}
button.pri{background:var(--gold);color:#04071a;border-color:var(--gold)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--blue)}
.note{color:var(--sub);font-size:12px;margin:4px 0 10px}
table{width:100%;border-collapse:collapse}
th,td{padding:6px 8px;border-bottom:1px solid #1b2450;text-align:left;vertical-align:middle}
th{color:var(--sub);font-size:12px;font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rate{display:flex;align-items:center;gap:8px;min-width:120px;white-space:nowrap}
.rate i{display:block;height:8px;border-radius:4px;background:var(--blue)}
.rate.bad i{background:var(--red)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.big{font-size:30px;font-weight:800;color:var(--gold)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:12px;margin:2px 4px 2px 0}
.empty{color:var(--sub);padding:10px 0}
.wrap{overflow-x:auto}
#src{display:none}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.slot{text-align:left;font-weight:700;line-height:1.3;padding:6px 8px;min-height:48px}
.slot.on,.pcard.on{border-color:var(--gold);background:#1a2660}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.pcard{text-align:left;padding:8px 10px}
#src.show{display:block}
</style>
</head>
<body>
<header>
  <h1>ベイX 対戦分析</h1>
  <span id="status" class="note" style="margin:0"></span>
  <span style="flex:1"></span>
  <button id="demo">仮のデータで見る</button>
  <button id="srcBtn">データの読み込み設定</button>
</header>
<main>
  <div id="src" class="card">
    <h2>データの読み込み</h2>
    <div class="note">データの読み出し先のURLとパスワードを入れてください。このブラウザだけに保存されます。</div>
    <div class="bar"><input id="url" placeholder="https://beylog.com/wp-json/beylog-sim/v1/log" style="flex:1;min-width:260px"><input id="key" placeholder="パスワード" style="width:160px"><button class="pri" id="load">読み込む</button></div>
    <div class="note">または、CSV／JSONのファイルを選ぶ：</div>
    <input type="file" id="file" accept=".csv,.json,.jsonl,text/csv,application/json">
  </div>

  <div class="bar">
    <label>期間</label>
    <select id="period"><option value="7">過去7日</option><option value="30">過去30日</option><option value="0" selected>全期間</option><option value="c">指定</option></select>
    <input type="date" id="from" style="display:none"><input type="date" id="to" style="display:none">
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const FIN = { spin: 'スピン', over: 'オーバー', burst: 'バースト', extreme: 'エクストリーム' };
const FINS = ['spin', 'over', 'burst', 'extreme'];
let ROWS = [], E = [];
const ls = { get: k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

// ---------- データの読み込み ----------
function parseCSV(t) {
  const out = []; let row = [], cur = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(cur); cur = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(cur); out.push(row); row = []; cur = ''; } else cur += c;
  }
  if (cur || row.length) { row.push(cur); out.push(row); }
  const head = out.shift() || [];
  return out.filter(r => r.length > 1).map(r => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ''])));
}
function setRows(rows, from) { ROWS = rows; $('status').textContent = `${rows.length}ラウンド（${from}）`; build(); }
let DEMO = false;
async function loadUrl(quiet) {
  if (DEMO) return;
  const url = $('url').value.trim(), key = $('key').value.trim();
  if (!url) { $('src').classList.add('show'); return; }
  if (!AUTO) { ls.set('bey_an_url', url); ls.set('bey_an_key', key); }
  if (quiet !== true) $('status').textContent = '読み込み中…';
  try {
    const since = ROWS.length && ROWS[ROWS.length - 1].id ? ROWS[ROWS.length - 1].id : 0; // 前に読んだ分より新しい行だけもらう
    const r = await fetch(url + (url.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(key) + '&since=' + since, { cache: 'no-store' });
    const j = await r.json();
    if (j.error) { $('status').textContent = 'パスワードが違います'; return; }
    setRows(since ? ROWS.concat(j.rows) : j.rows, '最新 ' + new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })); $('src').classList.remove('show');
  } catch (e) { if (quiet !== true) $('status').textContent = ''; }
}
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return; const t = await f.text();
  let rows;
  if (/^\s*[\[{]/.test(t)) { try { const j = JSON.parse(t); rows = Array.isArray(j) ? j : j.rows; } catch { rows = t.split('\n').filter(Boolean).map(l => JSON.parse(l)); } }
  else rows = parseCSV(t);
  setRows(rows, f.name); $('src').classList.remove('show');
};
$('load').onclick = () => loadUrl(); $('srcBtn').onclick = () => $('src').classList.toggle('show');
$('url').value = ls.get('bey_an_url'); $('key').value = ls.get('bey_an_key');

// ---------- 仮のデータ（表示の確認用。本物のデータには混ざらない） ----------
function demoRows() {
  // [カスタムのid, 名前, 強さ, タイプ（atk/def/sta/bal）]
  const C = [
    ['shark|r360|R', 'シャークスケイル 3-60 R', 0.9, 'atk'], ['wizard|r960|B', 'ウィザードロッド 9-60 B', 0.85, 'sta'], ['aero|r160|E', 'エアロペガサス 1-60 E', 0.8, 'atk'],
    ['glory||LR', 'グローリーワルキューレ LR', 0.75, 'atk'], ['meteor|r360|R', 'メテオドラグーン 3-60 R', 0.75, 'atk'], ['cobalt|r760|E', 'コバルトドラグーン 7-60 E', 0.7, 'atk'],
    ['knight2|r360|H', 'ナイトシールドV2 3-60 H', 0.7, 'def'], ['zeke|r160|LR', 'ジークスペリオン 1-60 LR', 0.7, 'atk'], ['phoenix|r960|H', 'フェニックスウイング 9-60 H', 0.6, 'bal'],
    ['hells||B', 'ヘルズネザー B', 0.55, 'sta'], ['wyvern|r160|R', 'ワイバーンホバー 1-60 R', 0.55, 'sta'], ['bullet||R', 'バレットグリフォン R', 0.5, 'atk'],
    ['luster|r560|K', 'ラスタードラグーン 5-60 K', 0.5, 'bal'], ['clock|r360|Nr', 'クロックミラージュ 3-60 Nr', 0.4, 'sta'], ['golem|r960|H', 'ゴーレムロック 9-60 H', 0.4, 'def'],
    ['scythe2|r360|B', 'ヘルズサイズV2 3-60 B', 0.35, 'sta'], ['dran2|r360|E', 'ドランソードV2 3-60 E', 0.25, 'atk'], ['warrow2|r960|B', 'ウィザードアローV2 9-60 B', 0.2, 'sta'],
    ['cx:pegasus:blast:A|r160|E', 'ペガサスブラスト A 1-60 E', 0.65, 'atk'], ['cx:knight:bolt:H|r360|R', 'ナイトボルト H 3-60 R', 0.5, 'atk'],
    ['cx:valkyrie:B+fortress:W|r160|B', 'ワルキューレフォートレス BW 1-60 B', 0.55, 'def'], ['cx:dran:G+whip:V|r960|H', 'ドランウィップ GV 9-60 H', 0.4, 'sta'],
    ['cx:emperor:T+rage:K|r360|UN', 'エンペラーレイジ TK 3-60 UN', 0.35, 'def'], ['cx:wizard:arc:W|r160|Nr', 'ウィザードアーク W 1-60 Nr', 0.25, 'sta'],
  ];
  let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const pickW = arr => { const t = arr.reduce((a, x) => a + x[1], 0); let r = rnd() * t; for (const x of arr) { r -= x[1]; if (r <= 0) return x[0]; } return arr[0][0]; };
  const popular = C.map((c, i) => [i, 1 + c[2] * 3]); // 強いカスタムほどよく使われる
  const mine = ls.get('bey_pid') || 'demo_me';
  const pids = [mine, ...Array.from({ length: 45 }, (_, i) => 'p' + (1000 + i * 37).toString(36))];
  const rows = [], now = Date.now();
  const FIN_BY = { atk: [['over', 4], ['extreme', 3], ['burst', 2], ['spin', 1]], def: [['spin', 3], ['over', 2], ['burst', 2], ['extreme', 1]], sta: [['spin', 6], ['over', 1], ['burst', 1], ['extreme', 1]], bal: [['spin', 3], ['over', 3], ['burst', 2], ['extreme', 2]] };
  const shot = (side, isAtk) => { const diag = rnd() < (isAtk ? 0.6 : 0.3); const x = (side === 'L' ? -1 : 1) * (60 + rnd() * 130), y = -150 + rnd() * 300; return { side, x: Math.round(x), y: Math.round(y), kind: diag ? '斜め' : '水平', aim: diag ? Math.round(-180 + rnd() * 360) : '', rpm: Math.round(9000 + rnd() * 5000) }; };
  for (let n = 0; n < 4000; n++) {
    const pid = rnd() < 0.08 ? mine : pids[1 + Math.floor(rnd() * (pids.length - 1))];
    const a = C[pickW(popular)], b = C[Math.floor(rnd() * C.length)];
    const vs = rnd() < 0.85 ? 'cpu' : rnd() < 0.5 ? '2p' : 'online';
    const s1 = shot(rnd() < 0.7 ? 'L' : 'R', a[3] === 'atk'), s2 = shot(s1.side === 'L' ? 'R' : 'L', b[3] === 'atk');
    const hits = rnd() < 0.12 ? 0 : 1 + Math.floor(rnd() * 6);
    // 勝つ確率：強さの差 ＋ シュートの相性（攻撃型は斜めで相手側、持久型は水平が少し有利）
    let pw = 0.5 + (a[2] - b[2]) * 0.6;
    const aim1 = s1.kind === '斜め' && typeof s1.aim === 'number' ? Math.cos((s1.aim * Math.PI) / 180) * (s1.side === 'L' ? 1 : -1) : 0;
    if (a[3] === 'atk') pw += s1.kind === '斜め' ? 0.08 * aim1 : -0.03; else if (a[3] === 'sta') pw += s1.kind === '水平' ? 0.06 : -0.04;
    if (!hits) pw += a[3] === 'sta' ? 0.15 : -0.15;
    const win = rnd() < Math.max(0.05, Math.min(0.95, pw)) ? 'p1' : 'p2';
    const wt = win === 'p1' ? a[3] : b[3];
    const finish = !hits ? 'spin' : pickW(FIN_BY[wt]);
    const dash = c => (/\|(E|R|LR|K)$/.test(c[0]) ? Math.floor(rnd() * 3) : rnd() < 0.3 ? 1 : 0);
    rows.push({ id: n + 1, time: new Date(now - rnd() * 30 * 864e5).toISOString(), pid, sid: 'demo', build: rnd() < 0.3 ? 'personal' : 'beylog', mode: rnd() < 0.85 ? 'versus' : 'tournament', vs, fmt: rnd() < 0.25 ? '3v3' : '1v1', diff: vs === 'cpu' ? 'normal' : '',
      p1: a[0], p1name: a[1], p2: b[0], p2name: b[1], win, finish,
      p1side: s1.side, p1x: s1.x, p1y: s1.y, p1shot: s1.kind, p1aim: s1.aim, p1rpm: s1.rpm, p1dash: dash(a),
      p2side: s2.side, p2x: s2.x, p2y: s2.y, p2shot: s2.kind, p2aim: s2.aim, p2rpm: s2.rpm, p2dash: dash(b),
      hits, firstHit: hits ? Math.round(10 + rnd() * 40) / 10 : '', sec: Math.round(30 + rnd() * 900) / 10 });
  }
  return rows;
}
$('demo').onclick = () => {
  DEMO = !DEMO;
  $('demo').textContent = DEMO ? '本物のデータに戻す' : '仮のデータで見る';
  $('demo').classList.toggle('on', DEMO);
  if (DEMO) { REAL = ROWS; setRows(demoRows(), '仮のデータ・表示の確認用'); $('status').style.color = 'var(--gold)'; }
  else { $('status').style.color = ''; if (REAL) setRows(REAL, '本物のデータ'); else { ROWS = []; build(); } loadUrl(); }
};
let REAL = null;

// ---------- 1ラウンド → 両方のベイから見た記録 ----------
const num = v => (v === '' || v == null ? null : +v);
function shotOf(r, p) { return { side: r[p + 'side'], x: num(r[p + 'x']), y: num(r[p + 'y']), kind: r[p + 'shot'], aim: num(r[p + 'aim']), rpm: num(r[p + 'rpm']), dash: +r[p + 'dash'] || 0 }; }
function build() {
  E = [];
  for (const r of ROWS) {
    const t = new Date(r.time || Date.now()), human2 = r.vs === '2p' || r.vs === 'online';
    for (const [me, op, h] of [['p1', 'p2', true], ['p2', 'p1', human2]]) {
      E.push({ t, pid: r.pid, build: r.build, human: h, fmt: r.fmt, vs: r.vs, key: r[me], name: r[me + 'name'], opp: r[op], oppName: r[op + 'name'], win: r.win === me, finish: r.finish, shot: shotOf(r, me), oshot: shotOf(r, op), hits: +r.hits || 0, sec: num(r.sec) });
    }
  }
  const pids = {}; for (const r of ROWS) pids[r.pid] = (pids[r.pid] || 0) + 1;
  NAMES = {}; for (const e of E) NAMES[e.key] = e.name;
  render();
}
let NAMES = {};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

// ---------- 絞り込み ----------
function filtered(days) {
  const per = days ?? $('period').value, cpu = false; // CPUのベイは数えない（人が選んだベイだけ）
  let from = 0, to = Infinity;
  if (per === 'c') { if ($('from').value) from = new Date($('from').value).getTime(); if ($('to').value) to = new Date($('to').value).getTime() + 864e5; }
  else if (+per) from = Date.now() - +per * 864e5;
  const bd = '';
  return E.filter(e => e.t >= from && e.t < to && (!bd || e.build === bd) && (e.human || cpu));
}
const minN = () => 20, topN = () => 10; // 最低対戦数は20、表示数は10で固定
// 少ない対戦数で上に来ないように、勝率の下限（ウィルソン）で並べる
function wilson(w, n) { if (!n) return 0; const z = 1.64, p = w / n; return (p + z * z / (2 * n) - z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n))) / (1 + z * z / n); }
const PTS = { spin: 1, over: 2, burst: 2, extreme: 3 }; // 本物のバトルと同じ点数
function group(es, kf) { const m = new Map(); for (const e of es) { const k = kf(e); if (k == null) continue; let g = m.get(k); if (!g) m.set(k, g = { key: k, n: 0, w: 0, pe: 0, pc: 0, es: [] }); g.n++; if (e.win) { g.w++; g.pe += PTS[e.finish] || 1; } else g.pc += PTS[e.finish] || 1; g.es.push(e); } return [...m.values()]; }
// ランキングの物差し（どれも対戦数が少ないものが上に来すぎないように、下限（ウィルソン）で並べる）
const M = {
  win:  { label: '勝率', bad: false, v: g => g.w / g.n },
  lose: { label: '負率', bad: true, v: g => (g.n - g.w) / g.n },
  pt:   { label: 'ポイント率', bad: false, v: g => g.pe / Math.max(1, g.pe + g.pc) },
  ptc:  { label: '取られたポイント率', bad: true, v: g => g.pc / Math.max(1, g.pe + g.pc) },
  use:  { label: '使用率', bad: false, v: (g, tot) => g.n / Math.max(1, tot) },
};
const rk = (g, m) => wilson(M[m].v(g) * g.n, g.n);
const mcell = (g, m, tot) => { const v = Math.round(M[m].v(g, tot) * 1000) / 10, s = m === 'use' ? v.toFixed(1) : Math.round(v); return `<div class="rate${M[m].bad ? ' bad' : ''}"><i style="width:${Math.max(2, m === 'use' ? v * 4 : v)}px"></i><b>${s}%</b></div>`; };
const mBtns = (attr, keys, cur) => `<div class="tabs" style="margin:0 0 10px">${keys.map(k => `<button class="${k === cur ? 'on' : ''}" data-${attr}="${k}">${M[k].label}</button>`).join('')}</div>`;
const PT_NOTE = `<div class="note" style="margin-top:10px;line-height:1.7">※ポイント率＝取ったポイント ÷（取ったポイント＋取られたポイント）。スピンフィニッシュ1点・オーバー／バーストフィニッシュ2点・エクストリームフィニッシュ3点で数えます。勝率だけだと点の小さいスピン勝ちが多いベイが上に来やすいので、大きい点で勝つ・大きい点を取られないベイを見るための数字です。3on3も、そのベイが出たラウンドごとに数えます。<br>※20戦以上したカスタムだけが出ます。</div>`;
const RK_NOTE = PT_NOTE.replace('<br>※20戦以上したカスタムだけが出ます。</div>', '') + `<br>※取られたポイント率＝取られたポイント ÷（取ったポイント＋取られたポイント）。<br>※使用率＝そのカスタムが使われた回数 ÷ 全カスタムが使われた回数。<br>※使用率以外は、20戦以上したカスタムだけが出ます。`;
const pct = (w, n) => (n ? Math.round((100 * w) / n) : 0);
const rateCell = (w, n, bad) => `<div class="rate${bad ? ' bad' : ''}"><i style="width:${Math.max(2, pct(w, n))}px"></i><b>${pct(w, n)}%</b></div>`;

// ---------- シュートの言い方 ----------
function posTxt(s) { if (s.y == null) return ''; return s.y < -60 ? '上側' : s.y > 60 ? '下側' : '真ん中の高さ'; }
function aimTxt(s) {
  if (s.kind !== '斜め' || s.aim == null || s.x == null) return '';
  const a = (s.aim * Math.PI) / 180, tc = Math.atan2(-s.y, -s.x); let d = Math.abs(a - tc); if (d > Math.PI) d = 2 * Math.PI - d;
  if (d < 0.7) return '中央へ';
  const ax = Math.cos(a); return (s.side === 'L' ? ax > 0 : ax < 0) ? '相手側へ' : '自分側へ';
}
function shotTxt(s) { return `${s.side === 'L' ? '左' : s.side === 'R' ? '右' : ''}側の${posTxt(s)}から${aimTxt(s)}${s.kind || ''}シュート`; }
function winPat(e) { return `${shotTxt(e.shot)}${e.shot.dash ? '→Xダッシュ' : ''}→${FIN[e.finish]}フィニッシュ`; }
function losePat(e) { return `${shotTxt(e.shot)}${e.hits ? '' : '→ぶつからず'}→${FIN[e.finish]}負け`; }

// ---------- 表 ----------
function table(cols, rows) { if (!rows.length) return '<div class="empty">データがまだありません（20戦以上したカスタムが出ます）</div>'; return `<div class="wrap"><table><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map((c, i) => `<td${typeof c === 'number' ? ' class="n"' : ''}>${c}</td>`).join('')}</tr>`).join('')}</table></div>`; }
function rankRows(gs, bad) { return gs.map((g, i) => [i + 1, esc(NAMES[g.key] || g.key), rateCell(g.w, g.n, bad), g.n]); }
function customSelect(id, es, label, kf = e => e.key) {
  const gs = group(es, kf).sort((a, b) => b.n - a.n);
  const keep = SEL[id];
  return `<label class="note">${label}</label> <input placeholder="名前で絞り込み" data-f="${id}" style="width:160px" value="${esc(FILTER[id] || '')}"> <select data-s="${id}">${gs.filter(g => !FILTER[id] || (NAMES[g.key] || '').includes(FILTER[id])).map(g => `<option value="${esc(g.key)}"${g.key === keep ? ' selected' : ''}>${esc(NAMES[g.key])}（${g.n}回）</option>`).join('')}</select>`;
}
const SEL = {}, FILTER = {};

// ---------- 各ページ ----------
const PAGES = {
  '今週の最強カスタム': () => {
    const es = filtered('7'), m = SEL.wk || 'win';
    const gs = group(es, e => e.key).filter(g => g.n >= minN()).sort((a, b) => rk(b, m) - rk(a, m)).slice(0, 10);
    return `<div class="card"><h2>今週の最強カスタム TOP10</h2>${mBtns('wk', ['win', 'pt'], m)}${table(['#', 'カスタム', M[m].label], gs.map((g, i) => [i + 1, esc(NAMES[g.key] || g.key), mcell(g, m)]))}${PT_NOTE}</div>`;
  },
  'ランキング': () => {
    const es = filtered(), gs = group(es, e => e.key), m = SEL.rk || 'win';
    const list = m === 'use' ? [...gs].sort((a, b) => b.n - a.n) : gs.filter(g => g.n >= minN()).sort((a, b) => rk(b, m) - rk(a, m));
    return `<div class="card"><h2>${M[m].label} TOP${topN()}</h2>${mBtns('rk', ['win', 'lose', 'pt', 'ptc', 'use'], m)}${table(['#', 'カスタム', M[m].label], list.slice(0, topN()).map((g, i) => [i + 1, esc(NAMES[g.key]), mcell(g, m, es.length)]))}${RK_NOTE}</div></div>`;
  },
  'フィニッシュ別': () => {
    const es = filtered(), f = SEL.fin || 'spin';
    // そのフィニッシュで勝った割合（そのカスタムの全対戦のうち）が高い順
    const gs = group(es, e => e.key).filter(g => g.n >= minN()).map(g => ({ ...g, fw: g.es.filter(e => e.win && e.finish === f).length }))
      .sort((a, b) => wilson(b.fw, b.n) - wilson(a.fw, a.n)).slice(0, topN());
    return `<div class="card"><h2>フィニッシュ別 TOP${topN()}</h2>
    <div class="tabs" style="margin:0 0 10px">${FINS.map(k => `<button class="${k === f ? 'on' : ''}" data-fin="${k}">${FIN[k]}フィニッシュ</button>`).join('')}</div>
    ${table(['#', 'カスタム', FIN[f] + 'で勝つ率'], gs.map((g, i) => [i + 1, esc(NAMES[g.key]), rateCell(g.fw, g.n)]))}</div>`;
  },
};
// ---------- カスタム比較：カスタマイズ画面と同じように、自分と相手のカスタムを選ぶ ----------
let PARTS = null; try { PARTS = window.parent !== window ? window.parent.__BEY_PARTS : null; } catch {}
const short = n => String(n).replace(/（.*）/, '');
const byId = (list, id) => (PARTS?.[list] || []).find(x => x.id === id);
function keyToSt(key) {
  const [b, r, t] = String(key || '').split('|');
  if (b && b.startsWith('cx:')) { const [, c, core, a] = b.split(':'); const om = core.includes('+') ? core.split('+') : null; return { line: 'CX', form: om ? 'om' : 'main', chip: c, main: om ? '' : core, over: om ? om[0] : '', metal: om ? om[1] : '', assist: a, ratchet: r || '', bit: t || '' }; }
  const bl = byId('blades', b); return { line: bl?.line || 'BX', blade: b || '', ratchet: r || '', bit: t || '' };
}
function stKey(st) {
  if (st.line === 'CX') return `cx:${st.chip}:${st.form === 'main' ? st.main : st.over + '+' + st.metal}:${st.assist}|${st.ratchet}|${st.bit}`;
  const bl = byId('blades', st.blade); return `${st.blade}|${bl?.int ? '' : st.ratchet}|${st.bit}`;
}
function stName(st) {
  const r = byId('ratchets', st.ratchet)?.name || '', t = byId('bits', st.bit)?.name || '';
  if (st.line === 'CX') { const c = byId('chips', st.chip)?.name || ''; const a = short(byId('assists', st.assist)?.name || '');
    return st.form === 'main' ? `${c}${byId('mains', st.main)?.name || ''} ${a} ${r} ${t}` : `${c}${byId('metals', st.metal)?.name || ''} ${short(byId('overs', st.over)?.name || '')}${a} ${r} ${t}`; }
  const bl = byId('blades', st.blade); return bl?.int ? `${bl.name} ${t}` : `${bl?.name || ''} ${r} ${t}`;
}
function slotsOf(st) {
  if (st.line !== 'CX') { const bl = byId('blades', st.blade); return [['blade', 'ブレード', PARTS.blades.filter(b => b.line === st.line)], ...(bl?.int ? [] : [['ratchet', 'ラチェット', PARTS.ratchets]]), ['bit', 'ビット', PARTS.bits]]; }
  return [['chip', 'チップ', PARTS.chips], ...(st.form === 'main' ? [['main', 'メイン', PARTS.mains]] : [['metal', 'メタル', PARTS.metals], ['over', 'オーバー', PARTS.overs]]), ['assist', 'アシスト', PARTS.assists], ['ratchet', 'ラチェット', PARTS.ratchets], ['bit', 'ビット', PARTS.bits]];
}
function setLine(st, line) {
  st.line = line;
  if (line === 'CX') { st.form ||= 'main'; st.chip ||= PARTS.chips[0].id; st.main ||= PARTS.mains[0]?.id || ''; st.metal ||= PARTS.metals[0]?.id || ''; st.over ||= PARTS.overs[0]?.id || ''; st.assist ||= PARTS.assists[0].id; }
  else { const bl = byId('blades', st.blade); if (!bl || bl.line !== line) st.blade = PARTS.blades.find(b => b.line === line)?.id || ''; }
  st.ratchet ||= PARTS.ratchets[0].id; st.bit ||= PARTS.bits[0].id;
}
let CMP = null, PICK = null;
const PAGE_CMP = () => { // カスタム比較（今はタブに出さない。あとで PAGES['カスタム比較'] = PAGE_CMP で戻す）
  if (!PARTS) return '<div class="card"><h2>カスタム比較</h2><div class="empty">シミュレーターの中（画像あり版の「対戦分析」）で開くと使えます。</div></div>';
  const es = filtered();
  if (!CMP) { const top = group(es, e => e.key).sort((a, b) => b.n - a.n)[0]; const mk = top?.key; const ok = mk ? group(top.es, e => e.opp).sort((a, b) => b.n - a.n)[0]?.key : '';
    CMP = { me: keyToSt(mk || ''), op: keyToSt(ok || mk || '') }; for (const st of [CMP.me, CMP.op]) setLine(st, st.line); }
  const side = (k, label, color) => { const st = CMP[k];
    return `<div class="card" style="margin:0;border-color:${color}"><div class="note" style="color:${color};font-weight:700">${label}</div>
      <div class="bar" style="margin:4px 0 6px">${['BX', 'UX', 'CX'].map(l => `<button class="${st.line === l ? 'on' : ''}" data-line="${k}:${l}" style="padding:2px 12px">${l}</button>`).join('')}
      ${st.line === 'CX' ? `<span class="note" style="margin:0 0 0 8px">組み方</span>${[['main', 'メイン型'], ['om', 'オーバー＋メタル型']].map(([f, n]) => `<button class="${st.form === f ? 'on' : ''}" data-form="${k}:${f}" style="padding:2px 10px">${n}</button>`).join('')}` : ''}</div>
      <div class="slots" style="grid-template-columns:repeat(auto-fill,minmax(96px,1fr))">${slotsOf(st).map(([sk, sl, list]) => { const on = PICK && PICK.side === k && PICK.slot === sk; return `<button class="slot${on ? ' on' : ''}" data-pick="${k}:${sk}"><span class="note" style="margin:0">${sl}</span><br>${esc(short(list.find(x => x.id === st[sk])?.name || '—'))}</button>`; }).join('')}</div>
      <div style="font-weight:800">${esc(stName(st))}</div></div>`; };
  let picker = '';
  if (PICK) { const st = CMP[PICK.side], sl = slotsOf(st).find(x => x[0] === PICK.slot);
    if (sl) picker = `<div class="card" style="margin:10px 0 0;background:var(--panel2)"><div class="note">${PICK.side === 'me' ? '自分' : '相手'}の${sl[1]}を選ぶ</div><div class="cards">${sl[2].map(x => `<button class="pcard${st[PICK.slot] === x.id ? ' on' : ''}" data-opt="${esc(x.id)}">${esc(x.name)}</button>`).join('')}</div></div>`; }
  const mk = stKey(CMP.me), ok = stKey(CMP.op);
  const vs = es.filter(e => e.key === mk && e.opp === ok), n = vs.length, w = vs.filter(e => e.win).length;
  const mine = vs.filter(e => e.win), theirs = vs.filter(e => !e.win);
  const best = (list, f) => { const g = {}; for (const e of list) { const k = shotTxt(f(e)); g[k] = (g[k] || 0) + 1; } const t = Object.entries(g).sort((a, b) => b[1] - a[1])[0]; return t ? esc(t[0]) : '—'; };
  const result = n ? `<div class="grid" style="margin-top:12px"><div class="card" style="margin:0;text-align:center"><div class="note">自分の勝率</div><div class="big">${pct(w, n)}%</div><div class="note">${n}戦 ${w}勝 ${n - w}敗</div></div></div>
    <div style="margin-top:12px">${table(['比較項目', '自分', '相手'], [
      ...FINS.map(f => [FIN[f] + 'で勝った回数', mine.filter(e => e.finish === f).length + '回', theirs.filter(e => e.finish === f).length + '回']),
      ['Xダッシュした割合', pct(vs.filter(e => e.shot.dash).length, n) + '%', pct(vs.filter(e => e.oshot.dash).length, n) + '%'],
      ['勝ったときに多いシュート', best(mine, e => e.shot), best(theirs, e => e.oshot)],
    ])}</div>` : `<div class="empty" style="margin-top:12px">この2つのカスタムが戦ったデータはまだありません</div>`;
  return `<div class="card"><h2>カスタム比較</h2><div class="grid">${side('me', '自分のカスタム', 'var(--blue)')}${side('op', '相手のカスタム', 'var(--red)')}</div>${picker}${result}</div>`;
};
function filteredAll() { return filtered(); }
function bestShot(es) { return group(es, e => shotTxt(e.shot)).filter(g => g.n >= 2).sort((a, b) => wilson(b.w, b.n) - wilson(a.w, a.n))[0]; }
function partsOf(key) {
  const [blade, ratchet, bit] = key.split('|');
  const ps = ['bit:' + bit];
  if (ratchet) ps.push('r:' + ratchet);
  if (blade.startsWith('cx:')) { const [, c, core, a] = blade.split(':'); ps.push('chip:' + c, 'as:' + a); if (core.includes('+')) { const [o, m] = core.split('+'); ps.push('over:' + o, 'metal:' + m); } else ps.push('main:' + core); }
  else ps.push('b:' + blade);
  return ps;
}

let TAB = ls.get('bey_an_tab') || '今週の最強カスタム';
if (!PAGES[TAB]) TAB = '今週の最強カスタム';
function render() {
  $('tabs').innerHTML = Object.keys(PAGES).map(k => `<button class="${k === TAB ? 'on' : ''}" data-tab="${k}">${k}</button>`).join('');
  $('view').innerHTML = E.length ? PAGES[TAB]() : '<div class="card"><h2>データがありません</h2><div class="note">まだ対戦データがありません。ベイろぐにプラグインを入れると、遊んだ結果がここに出ます。</div></div>';
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t) { TAB = t.dataset.tab; ls.set('bey_an_tab', TAB); PICK = null; render(); return; }
  const wk = e.target.closest('[data-wk]'); if (wk) { SEL.wk = wk.dataset.wk; render(); return; }
  const rb = e.target.closest('[data-rk]'); if (rb) { SEL.rk = rb.dataset.rk; render(); return; }
  const fb = e.target.closest('[data-fin]'); if (fb) { SEL.fin = fb.dataset.fin; render(); return; }
  const pk = e.target.closest('[data-pick]'); if (pk) { const [side, slot] = pk.dataset.pick.split(':'); PICK = PICK && PICK.side === side && PICK.slot === slot ? null : { side, slot }; render(); return; }
  const op = e.target.closest('[data-opt]'); if (op && PICK) { CMP[PICK.side][PICK.slot] = op.dataset.opt; PICK = null; render(); return; }
  const ln = e.target.closest('[data-line]'); if (ln) { const [side, l] = ln.dataset.line.split(':'); setLine(CMP[side], l); PICK = null; render(); return; }
  const fm = e.target.closest('[data-form]'); if (fm) { const [side, f] = fm.dataset.form.split(':'); CMP[side].form = f; PICK = null; render(); return; }
});
document.addEventListener('change', e => { const s = e.target.dataset?.s; if (s) { SEL[s] = e.target.value; render(); } });
document.addEventListener('input', e => { const f = e.target.dataset?.f; if (f) { FILTER[f] = e.target.value; const pos = e.target.selectionStart; render(); const n = document.querySelector(`[data-f="${f}"]`); if (n) { n.focus(); n.setSelectionRange(pos, pos); } } });
for (const id of ['period', 'from', 'to']) $(id).addEventListener('change', () => { const c = $('period').value === 'c'; $('from').style.display = $('to').style.display = c ? '' : 'none'; render(); });
// シミュレーター（個人用の版）の中で開いたときは、送り先とパスワードが分かるので、自動で読み込む（開いている間は1分ごとに更新）
let AUTO = null;
try { const P = window.parent !== window ? window.parent : null; if (P && P.__BEY_AN_KEY !== undefined) AUTO = { url: P.__BEY_LOG_URL || '', key: P.__BEY_AN_KEY || '' }; } catch {}
render();
if (AUTO) {
  $('srcBtn').style.display = 'none';
  if (AUTO.url && AUTO.key) { $('url').value = AUTO.url; $('key').value = AUTO.key; loadUrl(); setInterval(() => { if (!document.hidden) loadUrl(true); }, 60000); }
  else { $('status').textContent = ''; $('view').innerHTML = '<div class="card"><h2>記録の準備中です</h2><div class="note">記録の送り先がまだ設定されていません。設定されると、ここに自動でデータが出ます。</div></div>'; $('tabs').innerHTML = ''; }
} else if ($('url').value) loadUrl(); else $('src').classList.add('show');
</script>
